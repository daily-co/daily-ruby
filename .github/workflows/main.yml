name: Ruby CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ["3.1", "3.2", "3.3"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Ruby version
        run: ruby -v

      - name: Bundle config
        run: bundle config set --local deployment true

      - name: Bundle install
        run: bundle install -j $(nproc)

      # Unit tests only. The specs under spec/integration call the real API
      # and need DAILY_API_KEY, so they are left out here. Run them locally
      # with: DAILY_API_KEY=... bundle exec rspec --tag integration
      - name: Run unit tests
        run: bundle exec rspec --tag ~integration

      - name: Build the gem
        run: bundle exec rake build

      - name: Install the gem
        run: bundle exec rake install
